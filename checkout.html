<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout — Roots to Blooms</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
:root{
  --brand-green:#4EA337;
  --dark:#254D32;
  --accent:#c6e3d2;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fafafa;
}

/* PAGE LAYOUT */
.wrapper{
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* CART SUMMARY */
.summary{
  background:white;
  border-radius:12px;
  padding:16px;
  box-shadow:0 8px 18px rgba(0,0,0,.06);
  margin-bottom:18px;
}

.line{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed #eee;
}

.total{
  font-weight:800;
  font-size:18px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
}

/* FORM */
.form{
  background:white;
  border-radius:12px;
  padding:16px;
  box-shadow:0 8px 18px rgba(0,0,0,.06);
  display:flex;
  flex-direction:column;
  gap:10px;
}

input,select,textarea{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
  width:100%;
  box-sizing:border-box;
}

label{font-weight:700;}

button{
  background:var(--dark);
  color:white;
  border:none;
  padding:12px;
  border-radius:8px;
  font-weight:800;
  cursor:pointer;
}

.delivery-address{display:none; flex-direction:column; gap:6px;}
</style>
</head>

<body>

<div class="wrapper">

<h2>Checkout</h2>

<div class="summary">
  <div id="items"></div>
  <div class="total">
    <div>Total</div>
    <div id="total">$0.00</div>
  </div>
</div>

<div class="form">

<label>Name</label>
<input id="name">

<label>Email</label>
<input id="email">

<label>Phone *</label>
<input id="phone">

<label>Pickup or Delivery</label>
<select id="method" onchange="toggleAddress(this.value)">
  <option value="Pickup">Pickup</option>
  <option value="Delivery">Delivery</option>
</select>

<div class="delivery-address" id="addrBox">
  <input id="addr1" placeholder="Address line 1">
  <input id="city" placeholder="City">
  <input id="postal" placeholder="Postal code">
</div>

<label>Date</label>
<input id="date">

<label>Time</label>
<select id="time"></select>

<label>Notes</label>
<textarea id="notes"></textarea>

<button onclick="submitOrder()">Submit Order</button>

</div>

</div>

<script>
const STORAGE_KEY="plant_shop_cart_v8";
const ENDPOINT="https://script.google.com/macros/s/AKfycbxKVOYtyszNwsdNYX8iPZtYyYqDkxryKijLTNH73NqvjPWepLygI4UZ5jZYylBPytPF0A/exec";
const FORM="https://docs.google.com/forms/d/e/1FAIpQLSfgHhLNX1C2ucFehf8xHBs-2a3YhaXfNnkbWZ4QS16UlJSpdQ/formResponse";

let RAW=[], cart={};

async function init(){
  cart = JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");

  const res=await fetch(ENDPOINT);
  RAW=await res.json();

  renderSummary();
}
init();

function getProduct(id){
  return RAW.find(p=>p.id===id);
}

function renderSummary(){
  const wrap=document.getElementById("items");
  wrap.innerHTML="";

  let total=0;

  Object.entries(cart).forEach(([id,qty])=>{
    const p=getProduct(id);
    if(!p) return;

    const line=p.price*qty;
    total+=line;

    wrap.innerHTML+=`
      <div class="line">
        <div>${p.name} x${qty}</div>
        <div>$${line.toFixed(2)}</div>
      </div>
    `;
  });

  document.getElementById("total").innerText="$"+total.toFixed(2);
}

function toggleAddress(v){
  document.getElementById("addrBox").style.display=
    v==="Delivery"?"flex":"none";
}

/* DATE PICKER */
flatpickr("#date",{minDate:"today"});

function submitOrder(){

  if(Object.keys(cart).length===0){
    alert("Cart empty");
    return;
  }

  const items = Object.entries(cart).map(([id,qty])=>{
    const p=getProduct(id);
    return `${p.name} x${qty}`;
  }).join("\n");

  const data={
    "entry.1046011819":items,
    "entry.991310792":name.value,
    "entry.640553104":phone.value,
    "entry.1225481208":date.value,
    "entry.2009788871":time.value,
    "entry.2140423836":notes.value
  };

  const form=document.createElement("form");
  form.method="POST";
  form.action=FORM;

  Object.entries(data).forEach(([k,v])=>{
    const i=document.createElement("input");
    i.name=k;
    i.value=v;
    form.appendChild(i);
  });

  document.body.appendChild(form);
  form.submit();

  localStorage.removeItem(STORAGE_KEY);
}
</script>

</body>
</html>
