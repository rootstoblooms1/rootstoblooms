<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roots to Blooms — Checkout</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
:root{
  --brand-green:#4EA337;
  --brand-brown:#4A2300;
  --accent:#c6e3d2;
  --dark:#254D32;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fafafa;
}

/* ================= NAV ================= */
.topnav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 24px;
  background:var(--dark);
}
.topnav img{height:48px;}
.nav-links a{
  color:#fff;
  text-decoration:none;
  font-weight:700;
  margin-left:18px;
}

/* ================= LAYOUT ================= */
.checkout-wrap{
  max-width:1000px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns: 1fr 420px;
  gap:20px;
}

@media(max-width:900px){
  .checkout-wrap{
    grid-template-columns:1fr;
  }
}

.card{
  background:#fff;
  border-radius:12px;
  padding:16px;
  box-shadow:0 8px 18px rgba(0,0,0,0.06);
}

h2{
  margin-top:0;
  color:var(--dark);
}

/* ================= FORM ================= */
.customer-section{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.customer-section label{
  font-weight:700;
}

.customer-section input,
.customer-section select,
.customer-section textarea{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

.delivery-address{
  display:none;
  flex-direction:column;
  gap:6px;
}

/* ================= ORDER SUMMARY ================= */
.cart-line{
  display:flex;
  justify-content:space-between;
  border-bottom:1px dashed #eee;
  padding:8px 0;
}

.totals{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  margin-top:6px;
}

/* ================= BUTTON ================= */
.checkout-btn{
  margin-top:12px;
  background:var(--dark);
  color:#fff;
  border:none;
  padding:14px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  font-size:16px;
}

/* ================= CONFIRMATION ================= */
#confirmation-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.confirmation-card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  max-width:420px;
  text-align:center;
}
</style>
</head>

<body>

<nav class="topnav">
  <a href="/"><img src="IMG_1466.PNG" alt="Roots to Blooms"></a>
  <div class="nav-links">
    <a href="shop.html">Shop</a>
    <a href="/">Home</a>
  </div>
</nav>

<div class="checkout-wrap">

<!-- ================= CUSTOMER INFO ================= -->
<div class="card">
  <h2>Your Details</h2>

  <div class="customer-section">
    <label>Name</label>
    <input id="custName">

    <label>Email</label>
    <input id="custEmail" type="email">

    <label>Phone</label>
    <input id="custPhone" type="tel">

    <label>Preferred Contact</label>
    <select id="custContactMethod">
      <option>Call</option>
      <option>Text</option>
      <option>Email</option>
    </select>

    <label>Pickup or Delivery</label>
    <select id="custPickupDelivery" onchange="toggleDeliveryAddress(this.value)">
      <option value="Pickup">Pickup</option>
      <option value="Delivery">Delivery</option>
    </select>

    <div class="delivery-address" id="deliveryAddress">
      <input id="addr1" placeholder="Address Line 1">
      <input id="addr2" placeholder="Address Line 2">
      <input id="city" placeholder="City" oninput="calculateDeliveryFee()">
      <input id="postal" placeholder="Postal Code" oninput="calculateDeliveryFee()">
    </div>

    <label>Date</label>
    <input id="custDate">

    <label>Time</label>
    <select id="custTime"></select>

    <label>Notes</label>
    <textarea id="custNotes" rows="2"></textarea>

    <label>How did you hear about us?</label>
    <select id="custMarketing">
      <option>Google Search</option>
      <option>Facebook</option>
      <option>Instagram</option>
      <option>Poster</option>
      <option>From a Friend/Family Member</option>
      <option>Other</option>
    </select>
  </div>
</div>

<!-- ================= ORDER SUMMARY ================= -->
<div class="card">
  <h2>Your Order</h2>

  <div id="orderItems"></div>

  <div class="totals"><span>Subtotal</span><span id="productsTotal">$0.00</span></div>
  <div class="totals" id="deliveryRow" style="display:none">
    <span>Delivery</span><span id="deliveryTotal">$0.00</span>
  </div>
  <div class="totals"><strong>Total</strong><strong id="grandTotal">$0.00</strong></div>

  <button class="checkout-btn" id="checkoutBtn" onclick="submitOrder()">Place Order</button>
</div>

</div>

<!-- ================= CONFIRMATION ================= -->
<div id="confirmation-overlay">
  <div class="confirmation-card">
    <h2>Order Received 🌱</h2>
    <p>Thank you! Your order has been submitted.</p>
    <button class="checkout-btn" onclick="location.href='/'">Back Home</button>
  </div>
</div>

<iframe name="hidden" style="display:none;"></iframe>

<script>
const STORAGE_KEY="plant_shop_cart_v8";
let cart = JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
let RAW=[];
let deliveryFee=0;

const SHEET_ENDPOINT="https://script.google.com/macros/s/AKfycbxKVOYtyszNwsdNYX8iPZtYyYqDkxryKijLTNH73NqvjPWepLygI4UZ5jZYylBPytPF0A/exec";

/* ================= LOAD PRODUCTS ================= */
async function loadProducts(){
  const res = await fetch(SHEET_ENDPOINT);
  RAW = await res.json();
  RAW.forEach(p=>{
    p.price=Number(p.price);
  });
  renderSummary();
}
loadProducts();

/* ================= SUMMARY ================= */
function renderSummary(){
  const wrap=document.getElementById("orderItems");
  wrap.innerHTML="";
  let total=0;

  Object.entries(cart).forEach(([id,qty])=>{
    const p=RAW.find(x=>x.id===id);
    if(!p) return;
    const line=p.price*qty;
    total+=line;
    wrap.innerHTML+=`
      <div class="cart-line">
        <span>${p.name} × ${qty}</span>
        <span>$${line.toFixed(2)}</span>
      </div>`;
  });

  document.getElementById("productsTotal").innerText=`$${total.toFixed(2)}`;
  document.getElementById("grandTotal").innerText=`$${(total+deliveryFee).toFixed(2)}`;
}

/* ================= DELIVERY ================= */
function toggleDeliveryAddress(val){
  document.getElementById("deliveryAddress").style.display =
    val==="Delivery" ? "flex" : "none";
  if(val!=="Delivery"){ deliveryFee=0; renderSummary(); }
}

function calculateDeliveryFee(){
  const city=document.getElementById("city").value.toLowerCase();
  if(["halifax","dartmouth","spryfield"].includes(city)) deliveryFee=5;
  else if(["bedford","sackville"].includes(city)) deliveryFee=8;
  else deliveryFee=0;

  document.getElementById("deliveryRow").style.display =
    deliveryFee>0 ? "flex":"none";
  document.getElementById("deliveryTotal").innerText=`$${deliveryFee.toFixed(2)}`;
  renderSummary();
}

/* ================= TIME SLOT & DATE HANDLING ================= */
const custDate = document.getElementById("custDate");
flatpickr("#custDate", {
  minDate: "today",
  dateFormat: "Y-m-d",
  disable: [
    function(date) {
      // Return true to disable Thursdays (4 = Thursday)
      return date.getDay() === 4;
    }
  ],
  onChange: function(selectedDates, dateStr) {
    if (!dateStr) {
      custTime.innerHTML = "";
      return;
    }
    generateTimeSlots(); 
  }
});


const closedDays = ["thu"]; // days the shop is closed
const openHours = {
  mon:[19,21],
  tue:[19,21],
  wed:[19,21],
  thu:[],
  fri:[19,21],
  sat:[9,17],
  sun:[9,14]
};

// Set min date to today
const today = new Date();

// Generate time slots based on selected date
function generateTimeSlots() {
  custTime.innerHTML = "";

  const dateStr = custDate.value;
  if (!dateStr) {
    custTime.innerHTML = "<option>Please select a date first</option>";
    return;
  }

  const [year, month, day] = dateStr.split("-").map(Number);
  const selectedDate = new Date(year, month-1, day);

  const now = new Date();
  const isToday =
    selectedDate.toDateString() === now.toDateString();

  const dayMap = ["sun","mon","tue","wed","thu","fri","sat"];
  const dayName = dayMap[selectedDate.getDay()];
  const hours = openHours[dayName];

  if(!hours || hours.length===0){
    custTime.innerHTML = "<option>No slots available</option>";
    return;
  }

  for(let h = hours[0]; h < hours[1]; h++){
    for(let m = 0; m < 60; m += 30){

      const slot = new Date(year,month-1,day,h,m);

      // Skip past times today
      if(isToday && slot < now) continue;

      const raw = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      const hour12 = h % 12 || 12;
      const ampm = h < 12 ? "AM" : "PM";
      const pretty = `${hour12}:${String(m).padStart(2,'0')} ${ampm}`;

      custTime.innerHTML += `<option value="${raw}">${pretty}</option>`;
    }
  }

  if(custTime.innerHTML === "")
    custTime.innerHTML = "<option>No remaining slots today</option>";
}

/* ================= SUBMIT ================= */
  // -------- Robust Validation --------
if(Object.keys(cart).length === 0){
  alert("Your cart is empty.");
  return;
}

if(!custName.value.trim()){
  alert("Please enter your name.");
  return;
}

if(!custPhone.value.trim()){
  alert("Please enter a phone number.");
  return;
}

if(!custDate.value){
  alert("Please select a date.");
  return;
}

if(!custTime.value || custTime.options.length === 0){
  alert("Please select a time.");
  return;
}

// Delivery validation
if(custPickupDelivery.value === "Delivery"){
  if(!addr1.value.trim() || !city.value.trim() || !postal.value.trim()){
    alert("Please complete the delivery address.");
    return;
  }
}

  const items=Object.entries(cart).map(([id,q])=>{
    const p=RAW.find(x=>x.id===id);
    return `${p.name} x${q}`;
  }).join("\n");

  const total=document.getElementById("grandTotal").innerText;

  const formURL="https://docs.google.com/forms/d/e/1FAIpQLSfgHhLNX1C2ucFehf8xHBs-2a3YhaXfNnkbWZ4QS16UlJSpdQ/formResponse";
  const data={
    "entry.1046011819":items,
    "entry.362516403":total,
    "entry.991310792":custName.value,
    "entry.640553104":custPhone.value
  };

  const f=document.createElement("form");
  f.method="POST";f.action=formURL;f.target="hidden";
  Object.entries(data).forEach(([k,v])=>{
    const i=document.createElement("input");
    i.type="hidden";i.name=k;i.value=v;f.appendChild(i);
  });
  document.body.appendChild(f);
  f.submit();f.remove();

  localStorage.removeItem(STORAGE_KEY);
  document.getElementById("confirmation-overlay").style.display="flex";
}
</script>

</body>
</html>
